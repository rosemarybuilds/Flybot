[project]
name = "flybot"
version = "0.1.0"
description = "Experimental autonomous new-pair memecoin trading agent (simulation)."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
